name: Personal release installers
run-name: "Build v1.4.3 installers"

on:
  push:
    branches: [codex/build-v1.4.3]
  workflow_dispatch:

permissions:
  contents: read

env:
  PNPM_VERSION: "9"
  NODE_VERSION: "20"
  TUZI_SWITCH_RELEASE_REPOSITORY: tuziapi/tuzi-switch
  VITE_RELEASE_REPOSITORY: tuziapi/tuzi-switch

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release-tag.outputs.tag }}
    steps:
      - name: Pin release source
        id: release-tag
        run: echo "tag=3932704a02eab97b5f50d24295f0444d610db026" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: tuziapi/tuzi-switch
          ref: ${{ steps.release-tag.outputs.tag }}
      - name: Test Codex image render fallback
        run: >-
          python3 -m unittest discover
          -s src-tauri/resources/builtin-skills/codex-image-render-fallback/scripts
          -p 'test_*.py'
      - name: Check release signing mode
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY}" ]]; then
            echo "TAURI_SIGNING_PRIVATE_KEY is not configured; publishing installers without updater artifacts."
          else
            echo "TAURI_SIGNING_PRIVATE_KEY is configured; updater artifacts will be generated."
          fi
  build-macos-arm:
    needs: create-release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tuziapi/tuzi-switch
          ref: ${{ needs.create-release.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: pnpm install --frozen-lockfile
      - name: Prepare updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            exit 0
          fi
          KEY_PATH="$RUNNER_TEMP/tauri-updater.key"
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY_PATH" >> "$GITHUB_ENV"
      - name: Build
        env:
          APPLE_SIGNING_IDENTITY: "-"
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            RELEASE_CONFIG="$(node scripts/tauri-release-config.cjs --unsigned)"
          else
            RELEASE_CONFIG="$(node scripts/tauri-release-config.cjs)"
          fi
          pnpm tauri build --target aarch64-apple-darwin --config "$RELEASE_CONFIG"
      - name: Collect assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          BUNDLE="src-tauri/target/aarch64-apple-darwin/release/bundle"
          DMG="$(find "$BUNDLE/dmg" -name "*.dmg" -print -quit)"
          test -n "$DMG"
          cp "$DMG" "release-assets/tuzi-switch-macos-aarch64.dmg"
          UPDATE="$(find "$BUNDLE/macos" -name "*.tar.gz" -print -quit 2>/dev/null || true)"
          if [[ -n "${UPDATE:-}" ]]; then
            cp "$UPDATE" "release-assets/tuzi-switch-macos-aarch64.app.tar.gz"
            if [[ -f "$UPDATE.sig" ]]; then
              cp "$UPDATE.sig" "release-assets/tuzi-switch-macos-aarch64.app.tar.gz.sig"
            fi
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm-release-assets
          path: release-assets/*
          if-no-files-found: error

  build-windows:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tuziapi/tuzi-switch
          ref: ${{ needs.create-release.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: pnpm install --frozen-lockfile
      - name: Prepare updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            exit 0
          fi
          KEY_PATH="$RUNNER_TEMP/tauri-updater.key"
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY_PATH" >> "$GITHUB_ENV"
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            RELEASE_CONFIG="$(node scripts/tauri-release-config.cjs --desktop-product-name --unsigned)"
          else
            RELEASE_CONFIG="$(node scripts/tauri-release-config.cjs --desktop-product-name)"
          fi
          pnpm tauri build --verbose --config "$RELEASE_CONFIG"
      - name: Collect assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $bundle = "src-tauri/target/release/bundle"
          $msi = Get-ChildItem "$bundle/msi/*.msi" | Select-Object -First 1
          if (-not $msi) { throw "MSI installer not found" }
          Copy-Item $msi.FullName "release-assets/tuzi-switch-windows-x86_64.msi"
          $msiUpdate = Get-ChildItem "$bundle/msi/*.msi.zip" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($msiUpdate -and (Test-Path "$($msiUpdate.FullName).sig")) {
            Copy-Item $msiUpdate.FullName "release-assets/tuzi-switch-windows-x86_64.msi.zip"
            Copy-Item "$($msiUpdate.FullName).sig" "release-assets/tuzi-switch-windows-x86_64.msi.zip.sig"
          } elseif (Test-Path "$($msi.FullName).sig") {
            Copy-Item "$($msi.FullName).sig" "release-assets/tuzi-switch-windows-x86_64.msi.sig"
          }
          $setup = Get-ChildItem "$bundle/nsis/*-setup.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($setup) {
            Copy-Item $setup.FullName "release-assets/tuzi-switch-windows-x86_64-setup.exe"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: release-assets/*
          if-no-files-found: error

  build-linux:
    needs: create-release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tuziapi/tuzi-switch
          ref: ${{ needs.create-release.outputs.tag }}
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if timeout --foreground 5m sudo apt-get \
              -o Acquire::ForceIPv4=true \
              -o Acquire::Retries=3 \
              -o Acquire::http::Timeout=20 \
              -o Acquire::https::Timeout=20 \
              update \
              && timeout --foreground 10m sudo env DEBIAN_FRONTEND=noninteractive apt-get \
                -o Acquire::ForceIPv4=true \
                -o Acquire::Retries=3 \
                -o Acquire::http::Timeout=20 \
                -o Acquire::https::Timeout=20 \
                install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev; then
              break
            fi
            if [[ "$attempt" -eq 3 ]]; then
              echo "APT dependency installation failed after $attempt attempts" >&2
              exit 1
            fi
            sudo rm -rf /var/lib/apt/lists/partial
            sleep $((attempt * 10))
          done
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"
      - run: pnpm install --frozen-lockfile
      - name: Prepare updater signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            exit 0
          fi
          KEY_PATH="$RUNNER_TEMP/tauri-updater.key"
          printf '%s' "$TAURI_SIGNING_PRIVATE_KEY" > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          echo "TAURI_SIGNING_PRIVATE_KEY=$KEY_PATH" >> "$GITHUB_ENV"
      - name: Build
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]]; then
            RELEASE_CONFIG="$(node scripts/tauri-release-config.cjs --desktop-product-name --unsigned)"
          else
            RELEASE_CONFIG="$(node scripts/tauri-release-config.cjs --desktop-product-name)"
          fi
          pnpm tauri build --config "$RELEASE_CONFIG"
      - name: Collect assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          BUNDLE="src-tauri/target/release/bundle"
          APPIMAGE="$(find "$BUNDLE/appimage" -name "*.AppImage" -print -quit)"
          test -n "$APPIMAGE"
          cp "$APPIMAGE" "release-assets/tuzi-switch-linux-x86_64.AppImage"
          if [[ -f "$APPIMAGE.sig" ]]; then
            cp "$APPIMAGE.sig" "release-assets/tuzi-switch-linux-x86_64.AppImage.sig"
          fi
          DEB="$(find "$BUNDLE/deb" -name "*.deb" -print -quit || true)"
          RPM="$(find "$BUNDLE/rpm" -name "*.rpm" -print -quit || true)"
          if [[ -n "${DEB:-}" ]]; then cp "$DEB" "release-assets/tuzi-switch-linux-x86_64.deb"; fi
          if [[ -n "${RPM:-}" ]]; then cp "$RPM" "release-assets/tuzi-switch-linux-x86_64.rpm"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release-assets
          path: release-assets/*
          if-no-files-found: error

